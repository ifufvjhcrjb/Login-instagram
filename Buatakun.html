<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masukkan Nomor Ponsel</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      text-align: center;
    }

    p {
      font-size: 14px;
      text-align: center;
      margin: 0 20px 20px;
    }

    input {
      width: 80%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .info {
      font-size: 12px;
      color: #ccc;
      margin-bottom: 20px;
      text-align: center;
      width: 80%;
    }

    button {
      width: 80%;
      padding: 12px;
      font-size: 16px;
      background-color: #1877f2;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .secondary {
      background: none;
      border: 1px solid #fff;
    }

    a {
      font-size: 14px;
      color: #88c9ff;
      text-decoration: none;
      margin-top: 20px;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1 id="formTitle">Berapa nomor ponsel Anda?</h1>
  <p id="formDesc">Masukkan nomor ponsel yang bisa dihubungi. Tidak ada yang akan melihat informasi ini di profil Anda.</p>

  <input id="userInput" type="tel" placeholder="Nomor ponsel">

  <div class="info" id="formInfo">
    Anda mungkin menerima notifikasi WhatsApp dan SMS dari kami untuk tujuan keamanan dan login.
  </div>

  <button onclick="window.location.href='loginakun.html'">Berikutnya</button>
  <button class="secondary" onclick="switchToEmail()">Daftar dengan email</button>

  <a href="loginakun.html">Saya sudah memiliki akun</a>

  <script>
    function switchToEmail() {
      const input = document.getElementById('userInput');
      input.type = 'email';
      input.placeholder = 'Alamat email';
      
      document.getElementById('formTitle').innerText = 'Berapa alamat email Anda?';
      document.getElementById('formDesc').innerText = 'Masukkan email aktif Anda untuk melanjutkan.';
      document.getElementById('formInfo').innerText = 'Anda mungkin menerima email dari kami untuk tujuan keamanan dan login.';
    }
  </script>
</body>
</html>
